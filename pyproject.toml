[project]
name = "consera-snowflake"
version = "0.1.0"
description = "Snowflake-native project intelligence for Consera"
requires-python = "==3.11.*"
dependencies = [
  "chardet==5.2.0",
  "cryptography==46.0.5",
  "httpx==0.28.1",
  "pydantic==2.12.5",
  "snowflake-connector-python==4.7.1",
  "snowflake-snowpark-python==1.53.0",
]

[dependency-groups]
dev = [
  "hypothesis==6.156.9",
  "mypy==2.3.0",
  "pytest==9.1.1",
  "ruff==0.15.22",
  "sqlfluff==4.2.2",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["snowflake/procedures", "bridges", "."]
testpaths = ["snowflake/tests", "bridges/tests", "scripts/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "PERF", "RUF", "S", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["snowflake", "bridges", "scripts"]

[tool.sqlfluff.core]
dialect = "snowflake"
max_line_length = 100
large_file_skip_byte_limit = 0
exclude_rules = ["AL10", "CP02", "LT02", "LT05", "RF04"]

[tool.sqlfluff.indentation]
indented_joins = false
