<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">How Consera works</title>
  <desc id="desc">A project profile and public signals flow through deterministic filtering into evidence-bound alerts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="320"><stop stop-color="#030712"/><stop offset="1" stop-color="#081522"/></linearGradient>
    <linearGradient id="line" x1="98" y1="0" x2="1180" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#00CCF8"/><stop offset=".55" stop-color="#00FFB7"/><stop offset="1" stop-color="#F4C96C"/></linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .sans{font-family:"DM Sans",Inter,Arial,sans-serif}.mono{font-family:"Space Mono",Consolas,monospace}.path{stroke-dasharray:7 9;animation:move 11s linear infinite}.ring{animation:pulse 3s ease-out infinite;transform-box:fill-box;transform-origin:center}.r2{animation-delay:-1s}.r3{animation-delay:-2s}
      @keyframes move{to{stroke-dashoffset:-160}}@keyframes pulse{0%,25%{opacity:.6;transform:scale(.6)}85%,100%{opacity:0;transform:scale(1.45)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <rect width="1280" height="320" rx="24" fill="url(#bg)"/><rect x="1" y="1" width="1278" height="318" rx="23" fill="none" stroke="#A7E3ED" stroke-opacity=".16" stroke-width="2"/>
  <text x="48" y="46" class="mono" fill="#00FFB7" font-size="10" letter-spacing="1.8">FROM PROJECT CONTEXT TO JUSTIFIED INTERRUPTION</text>
  <text x="1232" y="46" class="mono" fill="#71858D" font-size="8" text-anchor="end">SILENCE IS THE DEFAULT</text>
  <path id="flow" d="M104 159H1178" fill="none" stroke="url(#line)" stroke-width="2.5" class="path"/>
  <circle r="5" fill="#EAFCFF" filter="url(#glow)"><animateMotion dur="7s" repeatCount="indefinite"><mpath href="#flow"/></animateMotion></circle>
  <circle r="4" fill="#00CCF8" filter="url(#glow)"><animateMotion dur="7s" begin="-2.3s" repeatCount="indefinite"><mpath href="#flow"/></animateMotion></circle>
  <circle r="4" fill="#00FFB7" filter="url(#glow)"><animateMotion dur="7s" begin="-4.6s" repeatCount="indefinite"><mpath href="#flow"/></animateMotion></circle>
  <g transform="translate(104 159)"><circle r="35" fill="#0B1723" stroke="#00CCF8"/><circle r="46" fill="none" stroke="#00CCF8" stroke-opacity=".24" class="ring"/><path d="M-12-8h24M-12 0h18M-12 8h21" stroke="#00CCF8" stroke-width="2" stroke-linecap="round"/><text y="74" class="mono" fill="#00CCF8" font-size="8" text-anchor="middle">01 / LEARN</text><text y="96" class="sans" fill="#EAFCFF" font-size="14" font-weight="700" text-anchor="middle">Reviewed profile</text><text y="114" class="sans" fill="#71858D" font-size="9" text-anchor="middle">Capabilities + constraints</text></g>
  <g transform="translate(372 159)"><circle r="35" fill="#0B1723" stroke="#00CCF8"/><circle r="46" fill="none" stroke="#00CCF8" stroke-opacity=".24" class="ring r2"/><path d="M-14 7 0-9 14 7M-8 7 0-2 8 7" fill="none" stroke="#00CCF8" stroke-width="2"/><text y="74" class="mono" fill="#00CCF8" font-size="8" text-anchor="middle">02 / WATCH</text><text y="96" class="sans" fill="#EAFCFF" font-size="14" font-weight="700" text-anchor="middle">Public signals</text><text y="114" class="sans" fill="#71858D" font-size="9" text-anchor="middle">Official bounded source</text></g>
  <g transform="translate(640 159)"><circle r="37" fill="#0A201C" stroke="#00FFB7"/><circle r="49" fill="none" stroke="#00FFB7" stroke-opacity=".24" class="ring r3"/><path d="M-15-9h30L6 1v11l-12 5V1Z" fill="none" stroke="#00FFB7" stroke-width="2"/><text y="74" class="mono" fill="#00FFB7" font-size="8" text-anchor="middle">03 / FILTER</text><text y="96" class="sans" fill="#EAFCFF" font-size="14" font-weight="700" text-anchor="middle">Consequence gate</text><text y="114" class="sans" fill="#71858D" font-size="9" text-anchor="middle">84 of 85 dismissed</text></g>
  <g transform="translate(908 159)"><circle r="35" fill="#0B1723" stroke="#00FFB7"/><circle cx="-10" cy="-3" r="5" fill="#00CCF8"/><circle cx="10" cy="-3" r="5" fill="#00FFB7"/><path d="M-6-2 6-2M0 2v10" stroke="#EAFCFF" stroke-width="1.5"/><text y="74" class="mono" fill="#00FFB7" font-size="8" text-anchor="middle">04 / EXPLAIN</text><text y="96" class="sans" fill="#EAFCFF" font-size="14" font-weight="700" text-anchor="middle">Evidence dossier</text><text y="114" class="sans" fill="#71858D" font-size="9" text-anchor="middle">Scores + uncertainty</text></g>
  <g transform="translate(1176 159)"><circle r="35" fill="#2B2514" stroke="#F4C96C"/><circle r="46" fill="none" stroke="#F4C96C" stroke-opacity=".24" class="ring r2"/><path d="M-10 5V-4a10 10 0 0 1 20 0v9l4 5h-28Z" fill="none" stroke="#F4C96C" stroke-width="2"/><circle cy="14" r="2.5" fill="#F4C96C"/><text y="74" class="mono" fill="#F4C96C" font-size="8" text-anchor="middle">05 / ALERT</text><text y="96" class="sans" fill="#EAFCFF" font-size="14" font-weight="700" text-anchor="middle">Only when warranted</text><text y="114" class="sans" fill="#71858D" font-size="9" text-anchor="middle">Email + product record</text></g>
</svg>
