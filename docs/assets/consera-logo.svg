<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Consera logo</title>
  <desc id="desc">A radar-shaped C resolves an incoming signal into one consequence node.</desc>
  <defs>
    <linearGradient id="frame" x1="24" y1="18" x2="232" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1723"/>
      <stop offset="1" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="signal" x1="45" y1="44" x2="220" y2="205" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00CCF8"/>
      <stop offset="1" stop-color="#00FFB7"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .outer{stroke-dasharray:430;animation:draw 3s cubic-bezier(.22,1,.36,1) both}
      .inner{stroke-dasharray:260;animation:draw 2.4s .25s cubic-bezier(.22,1,.36,1) both}
      .beam{stroke-dasharray:80;animation:beam 2.2s .7s cubic-bezier(.22,1,.36,1) both}
      .node{animation:pulse 2.8s 1.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
      @keyframes draw{from{stroke-dashoffset:430}to{stroke-dashoffset:0}}
      @keyframes beam{from{stroke-dashoffset:80}to{stroke-dashoffset:0}}
      @keyframes pulse{0%,35%{opacity:.9;transform:scale(.7)}80%,100%{opacity:0;transform:scale(2.5)}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <rect x="12" y="12" width="232" height="232" rx="58" fill="url(#frame)" stroke="#163044" stroke-width="2"/>
  <path d="M32 128H13M243 128h-19M128 32V13m0 230v-19" stroke="#25445A" stroke-width="2" stroke-linecap="round"/>
  <path class="outer" d="M184 54A88 88 0 1 0 184 202" fill="none" stroke="url(#signal)" stroke-width="12" stroke-linecap="round"/>
  <path class="inner" d="M166 82a55 55 0 1 0 0 92" fill="none" stroke="#00FFB7" stroke-width="7" stroke-linecap="round" opacity=".9"/>
  <path class="beam" d="M125 128h92" fill="none" stroke="#EAFCFF" stroke-width="4" stroke-linecap="round"/>
  <circle cx="125" cy="128" r="9" fill="#030712" stroke="#00FFB7" stroke-width="4"/>
  <circle cx="217" cy="128" r="11" fill="#00CCF8" filter="url(#glow)"/>
  <circle class="node" cx="217" cy="128" r="11" fill="none" stroke="#00CCF8" stroke-width="3"/>
</svg>
