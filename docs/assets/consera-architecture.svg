<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 660" role="img" aria-labelledby="title desc">
  <title id="title">Consera architecture</title>
  <desc id="desc">Static product experience and a narrow Worker API connect to a Snowflake-native intelligence control plane.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="660"><stop stop-color="#F5FBFC"/><stop offset="1" stop-color="#EAF7F6"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0v28" fill="none" stroke="#07131D" stroke-opacity=".04"/></pattern>
    <filter id="shadow" x="-20%" y="-30%" width="150%" height="170%"><feDropShadow dx="5" dy="6" stdDeviation="0" flood-color="#07131D" flood-opacity=".13"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4Z" fill="#07131D"/></marker>
    <style>.sans{font-family:"DM Sans",Inter,Arial,sans-serif}.mono{font-family:"Space Mono",Consolas,monospace}.flow{stroke-dasharray:7 8;animation:flow 12s linear infinite}@keyframes flow{to{stroke-dashoffset:-150}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
  </defs>
  <rect width="1280" height="660" rx="24" fill="url(#bg)"/><rect width="1280" height="660" rx="24" fill="url(#grid)"/><rect x="1" y="1" width="1278" height="658" rx="23" fill="none" stroke="#07131D" stroke-opacity=".2" stroke-width="2"/>
  <g transform="translate(48 40)"><rect width="46" height="46" rx="13" fill="#030712"/><path d="M31 10a14 14 0 1 0 0 26" fill="none" stroke="#00CCF8" stroke-width="3" stroke-linecap="round"/><path d="M27 16a8 8 0 1 0 0 14" fill="none" stroke="#00FFB7" stroke-width="2" stroke-linecap="round"/><path d="M23 23h15" stroke="#EAFCFF" stroke-width="1.5"/><circle cx="38" cy="23" r="3" fill="#00CCF8"/></g>
  <text x="110" y="58" class="mono" fill="#536871" font-size="9" letter-spacing="1.4">SYSTEM AT A GLANCE</text>
  <text x="110" y="83" class="sans" fill="#07131D" font-size="25" font-weight="760" letter-spacing="-1">One narrow path from public signal to justified action.</text>

  <text x="48" y="135" class="mono" fill="#536871" font-size="8" letter-spacing="1.3">01 / PRODUCT AND INGESTION EDGE</text>
  <g filter="url(#shadow)">
    <g transform="translate(48 151)"><rect width="272" height="122" rx="14" fill="#030712" stroke="#07131D" stroke-width="2"/><circle cx="27" cy="28" r="9" fill="#00CCF8"/><text x="46" y="31" class="mono" fill="#9EB2B9" font-size="7">STATIC EXPERIENCE</text><text x="20" y="68" class="sans" fill="#EAFCFF" font-size="18" font-weight="750">Next.js product</text><text x="20" y="92" class="sans" fill="#9EB2B9" font-size="9">Landing + five focused surfaces</text><text x="20" y="108" class="sans" fill="#9EB2B9" font-size="9">Human profile review</text></g>
    <g transform="translate(347 151)"><rect width="272" height="122" rx="14" fill="#FFF" stroke="#07131D" stroke-width="2"/><circle cx="27" cy="28" r="9" fill="#00CCF8" stroke="#07131D"/><text x="46" y="31" class="mono" fill="#536871" font-size="7">CLOUDFLARE</text><text x="20" y="68" class="sans" fill="#07131D" font-size="18" font-weight="750">Hono Worker API</text><text x="20" y="92" class="sans" fill="#536871" font-size="9">Signed session + CSRF + origin</text><text x="20" y="108" class="sans" fill="#536871" font-size="9">Fixed SQL operation allowlist</text></g>
    <g transform="translate(646 151)"><rect width="272" height="122" rx="14" fill="#FFF" stroke="#07131D" stroke-width="2"/><circle cx="27" cy="28" r="9" fill="#00FFB7" stroke="#07131D"/><text x="46" y="31" class="mono" fill="#536871" font-size="7">FREE BRIDGE</text><text x="20" y="68" class="sans" fill="#07131D" font-size="18" font-weight="750">GitHub Actions</text><text x="20" y="92" class="sans" fill="#536871" font-size="9">Official Hacker News API only</text><text x="20" y="108" class="sans" fill="#536871" font-size="9">Bounded, hashed, replay safe</text></g>
    <g transform="translate(945 151)"><rect width="286" height="122" rx="14" fill="#E8FFFA" stroke="#07131D" stroke-width="2"/><circle cx="27" cy="28" r="9" fill="#F4C96C" stroke="#07131D"/><text x="46" y="31" class="mono" fill="#536871" font-size="7">VERIFIED DELIVERY</text><text x="20" y="68" class="sans" fill="#07131D" font-size="18" font-weight="750">Snowflake email</text><text x="20" y="92" class="sans" fill="#536871" font-size="9">Daily caps + cooldown + dedupe</text><text x="20" y="108" class="sans" fill="#536871" font-size="9">Ambiguous outcomes never retried blind</text></g>
  </g>
  <path d="M320 212h21M619 212h21M918 212h21" fill="none" stroke="#07131D" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="48" y="303" width="1183" height="54" rx="12" fill="#00FFB7" stroke="#07131D" stroke-width="2"/>
  <text x="69" y="325" class="mono" fill="#07131D" font-size="7" letter-spacing="1.1">NARROW APPLICATION BOUNDARY</text>
  <text x="69" y="344" class="sans" fill="#07131D" font-size="11" font-weight="700">The browser chooses product operations, never SQL, object names, procedure names, or Snowflake authority.</text>
  <path d="M640 273v24" stroke="#07131D" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="48" y="399" class="mono" fill="#536871" font-size="8" letter-spacing="1.3">02 / SNOWFLAKE-NATIVE INTELLIGENCE CONTROL PLANE</text>
  <g filter="url(#shadow)">
    <g transform="translate(48 415)"><rect width="218" height="161" rx="14" fill="#FFF" stroke="#07131D" stroke-width="2"/><rect width="218" height="42" rx="13" fill="#DDF7FF"/><path d="M0 42h218" stroke="#07131D" stroke-width="2"/><text x="16" y="26" class="mono" fill="#07131D" font-size="7">PROFILE CORE</text><text x="16" y="76" class="sans" fill="#07131D" font-size="15" font-weight="750">Reviewed context</text><text x="16" y="101" class="sans" fill="#536871" font-size="9">Versioned project facts</text><text x="16" y="120" class="sans" fill="#536871" font-size="9">Deterministic completeness</text><text x="16" y="139" class="sans" fill="#536871" font-size="9">Immutable activation</text></g>
    <g transform="translate(289 415)"><rect width="218" height="161" rx="14" fill="#FFF" stroke="#07131D" stroke-width="2"/><rect width="218" height="42" rx="13" fill="#E6FFF7"/><path d="M0 42h218" stroke="#07131D" stroke-width="2"/><text x="16" y="26" class="mono" fill="#07131D" font-size="7">STREAM + TASK GRAPH</text><text x="16" y="76" class="sans" fill="#07131D" font-size="15" font-weight="750">Bounded pipeline</text><text x="16" y="101" class="sans" fill="#536871" font-size="9">Normalize + prefilter</text><text x="16" y="120" class="sans" fill="#536871" font-size="9">Fenced evaluation leases</text><text x="16" y="139" class="sans" fill="#536871" font-size="9">Replay-safe queues</text></g>
    <g transform="translate(530 415)"><rect width="218" height="161" rx="14" fill="#FFF" stroke="#07131D" stroke-width="2"/><rect width="218" height="42" rx="13" fill="#DDF7FF"/><path d="M0 42h218" stroke="#07131D" stroke-width="2"/><text x="16" y="26" class="mono" fill="#07131D" font-size="7">AI_COMPLETE</text><text x="16" y="76" class="sans" fill="#07131D" font-size="15" font-weight="750">Advisory analysis</text><text x="16" y="101" class="sans" fill="#536871" font-size="9">Exact structured output</text><text x="16" y="120" class="sans" fill="#536871" font-size="9">Stored evidence IDs</text><text x="16" y="139" class="sans" fill="#536871" font-size="9">One bounded attempt</text></g>
    <g transform="translate(771 415)"><rect width="218" height="161" rx="14" fill="#FFF" stroke="#07131D" stroke-width="2"/><rect width="218" height="42" rx="13" fill="#FFF5D8"/><path d="M0 42h218" stroke="#07131D" stroke-width="2"/><text x="16" y="26" class="mono" fill="#07131D" font-size="7">POLICY ENGINE</text><text x="16" y="76" class="sans" fill="#07131D" font-size="15" font-weight="750">Deterministic gate</text><text x="16" y="101" class="sans" fill="#536871" font-size="9">Score ownership</text><text x="16" y="120" class="sans" fill="#536871" font-size="9">Evidence validation</text><text x="16" y="139" class="sans" fill="#536871" font-size="9">Silence or publish</text></g>
    <g transform="translate(1012 415)"><rect width="219" height="161" rx="14" fill="#030712" stroke="#07131D" stroke-width="2"/><rect width="219" height="42" rx="13" fill="#00FFB7"/><path d="M0 42h219" stroke="#07131D" stroke-width="2"/><text x="16" y="26" class="mono" fill="#07131D" font-size="7">APPLICATION RECORD</text><text x="16" y="76" class="sans" fill="#EAFCFF" font-size="15" font-weight="750">Explainable result</text><text x="16" y="101" class="sans" fill="#9EB2B9" font-size="9">Dossier + citations</text><text x="16" y="120" class="sans" fill="#9EB2B9" font-size="9">Alert decision + reason</text><text x="16" y="139" class="sans" fill="#9EB2B9" font-size="9">Cost + health record</text></g>
  </g>
  <path d="M266 496h17M507 496h17M748 496h17M989 496h17" fill="none" stroke="#07131D" stroke-width="1.5" marker-end="url(#arrow)" class="flow"/>
  <g transform="translate(48 606)"><rect width="1183" height="32" rx="9" fill="#FFF" stroke="#07131D" stroke-opacity=".22"/><text x="17" y="20" class="mono" fill="#536871" font-size="7">INVARIANTS</text><text x="112" y="20" class="sans" fill="#07131D" font-size="9" font-weight="700">External text is never instruction</text><circle cx="302" cy="16" r="2.5" fill="#00CCF8"/><text x="316" y="20" class="sans" fill="#07131D" font-size="9" font-weight="700">AI never owns publication</text><circle cx="487" cy="16" r="2.5" fill="#00CCF8"/><text x="501" y="20" class="sans" fill="#07131D" font-size="9" font-weight="700">Every interruption is explainable</text><circle cx="700" cy="16" r="2.5" fill="#00CCF8"/><text x="714" y="20" class="sans" fill="#07131D" font-size="9" font-weight="700">USD 0 out of pocket</text><circle cx="857" cy="16" r="2.5" fill="#00CCF8"/><text x="871" y="20" class="sans" fill="#07131D" font-size="9" font-weight="700">Snowflake remains authoritative</text></g>
</svg>
