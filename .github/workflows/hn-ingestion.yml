name: Ingest Hacker News

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      fetch_mode:
        description: Ingestion reason
        required: false
        default: manual
        type: choice
        options:
          - manual
          - scheduled

concurrency:
  group: consera-hn-ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CONSERA_SNOWFLAKE_READY:
        ${{ secrets.SNOWFLAKE_ACCOUNT != '' && secrets.SNOWFLAKE_PRIVATE_KEY_B64 != '' }}
    steps:
      - name: Check out the exact revision
        if: env.CONSERA_SNOWFLAKE_READY == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        if: env.CONSERA_SNOWFLAKE_READY == 'true'
        uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b # v7.2.0
        with:
          enable-cache: true

      - name: Select Python
        if: env.CONSERA_SNOWFLAKE_READY == 'true'
        run: uv python install 3.11

      - name: Install locked runtime
        if: env.CONSERA_SNOWFLAKE_READY == 'true'
        run: uv sync --frozen --no-dev

      - name: Report pending platform connection
        if: env.CONSERA_SNOWFLAKE_READY != 'true'
        run: echo "Consera ingestion is paused until its isolated Snowflake identity is connected."

      - name: Fetch and ingest bounded signals
        if: env.CONSERA_SNOWFLAKE_READY == 'true'
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          PYTHONPATH: bridges:snowflake/procedures
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_DATABASE: CONSERA
          SNOWFLAKE_PRIVATE_KEY_B64: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_B64 }}
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
          SNOWFLAKE_ROLE: CONSERA_INGEST_ROLE
          SNOWFLAKE_USER: CONSERA_INGEST_SERVICE
          SNOWFLAKE_WAREHOUSE: CONSERA_INGEST_WH
        run: >-
          uv run python -m hn_bridge.main --mode "${{ inputs.fetch_mode || 'scheduled' }}"
          --max-stories 30 --max-comments 100
